name: CAPCAST Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Run server regression tests
        run: python -B -m unittest discover -s tests -p 'test_server.py' -v

      - name: Run validation and overtime scoring tests
        run: python -B -m unittest tests.test_parity tests.test_scoring -v

      - name: Run release packaging tests
        run: python -B -m unittest tests.test_dist -v

      - name: Install browser test dependencies
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install "playwright==1.65.1"
          python -m playwright install --with-deps chromium

      - name: Run browser integration tests
        if: matrix.python-version == '3.13'
        run: python -B -m unittest tests.e2e.test_e2e -v
