name: CAPCAST Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run server regression tests
        run: python -B -m unittest discover -s tests -p 'test_server.py' -v

      - name: Run validation and overtime scoring tests
        run: python -B -m unittest tests.test_parity tests.test_scoring -v

      - name: Run release packaging tests
        run: python -B -m unittest tests.test_dist -v

      - name: Install browser test dependencies
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run browser integration tests
        if: matrix.python-version == '3.13'
        run: python -B -m unittest tests.e2e.test_e2e -v
